<!doctype html>
<!-- First-paint default: every --ui-* token scopes to a [data-ui-theme] root,
     and the theme bridge stamps light/dark only once React mounts. Light here
     matches what the pre-mount frame gets from index.css :root today. -->
<html lang="en" data-ui-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookmarkIt — Quick Add</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/popup/main.jsx"></script>
  </body>
</html>
