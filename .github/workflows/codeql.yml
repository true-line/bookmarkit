# Advanced CodeQL analysis invoked only by the governed CI lifecycle. Keeping
# this reusable prevents GitHub's unselectable github-advanced-security[bot]
# default-setup actor from bypassing the repository Actions Policy.
name: CodeQL

on:
  workflow_call:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

# Jobs run on the organisation's own runners: the Linux runner group holds one
# x86-64 runner, the MacOS group one arm64 runner. A fork's pull request and a
# merge-queue run keep a hosted runner, because a pull request controls the
# workflow file it runs and would otherwise execute its own code on the
# organisation's hardware.
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ fromJSON((github.event_name == 'merge_group' || github.event.pull_request.head.repo.fork) && '["ubuntu-latest"]' || '["self-hosted", "Linux", "X64"]') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The organisation's Linux runner does not carry Node on its default PATH.
      # This step reaches for `node`, or runs an action that does, so the
      # runtime is installed first, with the same pinned action the rest of
      # the workflow already uses.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: /language:${{ matrix.language }}
