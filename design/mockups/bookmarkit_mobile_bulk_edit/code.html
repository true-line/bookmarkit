  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&amp;family=Radio+Canada+Big:wght@400;500;600;700&amp;family=Red+Hat+Text:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>
    .material-symbols-outlined {
      display: inline-block;
      width: 1em;
      height: 1em;
      line-height: 1 !important;
      box-sizing: content-box;
      overflow: hidden;
      white-space: nowrap;
      direction: ltr;
      vertical-align: middle;
    }
  </style>
</head>
<body class="bg-light-surface text-light-on-surface font-body antialiased min-h-[884px] flex flex-col" data-stitch-vh="min-h-[884px]===min-h-screen">

  <!-- Sticky Mobile Top Bar -->
  <header class="sticky top-0 z-20 bg-light-surface-container-low/95 backdrop-blur-sm border-b border-light-outline-variant px-4 py-3 flex items-center justify-between gap-2">
    <div class="flex items-center gap-2.5 min-w-0">
      <button data-component-id="button-icon" data-component-type="button" data-component-variant="icon" type="button" aria-label="Back to bookmarks" class="inline-flex items-center justify-center min-w-11 min-h-11 rounded bg-light-surface-container text-light-on-surface border border-light-outline-variant hover:bg-light-surface-container-high focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-light-primary transition-colors duration-state-change ease-state-change motion-reduce:transition-none shrink-0">
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">arrow_back</span>
      </button>
      <div class="min-w-0 text-start">
        <h1 data-design-text-token="headline-sm" class="font-headline text-headline-sm text-light-on-surface truncate">Bulk Edit</h1>
        <p data-design-text-token="label-sm" class="text-label-sm text-light-on-surface-variant tabular-nums truncate">4 bookmarks selected</p>
      </div>
    </div>
  </header>

  <main class="flex-1 px-4 py-4 pb-28 flex flex-col gap-4 text-start">
    <!-- Selected Items Preview -->
    <section class="bg-light-surface-container-low border border-light-outline-variant rounded-md p-3.5 flex flex-col gap-2">
      <div class="flex items-center justify-between">
        <span data-design-text-token="label-md" class="text-label-md text-light-on-surface">Selected items</span>
        <span data-design-text-token="label-sm" class="text-label-sm text-light-primary tabular-nums">4 of 2,089</span>
      </div>
      <ul class="flex flex-col gap-1 text-body-sm text-light-on-surface-variant">
        <li class="truncate">• Context7 — Up-to-date docs</li>
        <li class="truncate">• Frequently Asked Questions — kitty</li>
        <li class="truncate">• CSS Logical Properties — MDN</li>
        <li class="truncate">• WebMCP Browser Agent Protocol</li>
      </ul>
    </section>

    <!-- Move to Folder -->
    <section class="bg-light-surface-container-lowest border border-light-outline-variant rounded-md p-4 shadow-sm flex flex-col gap-3">
      <h2 data-design-text-token="headline-sm" class="font-headline text-headline-sm text-light-on-surface">Folder</h2>
      <label class="flex flex-col gap-1.5">
        <span data-design-text-token="label-md" class="text-label-md text-light-on-surface">Move selected to</span>
        <select class="w-full min-h-11 rounded border border-light-outline bg-light-surface-container-lowest px-3.5 py-2 text-body-md text-light-on-surface focus:border-light-primary focus:outline-none focus:ring-2 focus:ring-light-primary/20">
          <option value selected>Keep existing folders</option>
          <option value="ai">AI &amp; Agents</option>
          <option value="terminal">Terminal &amp; CLI</option>
          <option value="design">Design Systems</option>
        </select>
      </label>
    </section>

    <!-- Add / Remove Tags -->
    <section class="bg-light-surface-container-lowest border border-light-outline-variant rounded-md p-4 shadow-sm flex flex-col gap-3">
      <div class="flex items-center justify-between gap-2">
        <h2 data-design-text-token="headline-sm" class="font-headline text-headline-sm text-light-on-surface">Tags</h2>
        <button data-component-id="button-tertiary" data-component-type="button" data-component-variant="tertiary" type="button" class="inline-flex items-center justify-center gap-1.5 min-h-9 px-3 py-1.5 rounded bg-light-tertiary-container text-light-on-tertiary shadow-sm hover:bg-light-tertiary focus-visible:outline focus-visible:outline-2 focus-visible:outline-light-tertiary">
          <span class="material-symbols-outlined text-[15px]" aria-hidden="true">auto_awesome</span>
          <span data-design-text-token="label-md" class="text-label-md">Auto-Tag</span>
        </button>
      </div>

      <label class="flex flex-col gap-1.5">
        <span data-design-text-token="label-md" class="text-label-md text-light-on-surface">Add tags</span>
        <input type="text" dir="auto" placeholder="e.g., reference, Q4" class="w-full min-h-11 rounded border border-light-outline bg-light-surface-container-lowest px-3.5 py-2 text-body-md text-light-on-surface placeholder:text-light-outline focus:border-light-primary focus:outline-none focus:ring-2 focus:ring-light-primary/20">
      </label>

      <label class="flex flex-col gap-1.5">
        <span data-design-text-token="label-md" class="text-label-md text-light-on-surface">Remove tags</span>
        <input type="text" dir="auto" placeholder="e.g., unread, temp" class="w-full min-h-11 rounded border border-light-outline bg-light-surface-container-lowest px-3.5 py-2 text-body-md text-light-on-surface placeholder:text-light-outline focus:border-light-primary focus:outline-none focus:ring-2 focus:ring-light-primary/20">
      </label>
    </section>

    <!-- Danger Zone -->
    <section class="bg-light-surface-container-lowest border border-light-outline-variant rounded-md p-4 shadow-sm flex flex-col gap-3">
      <h2 data-design-text-token="headline-sm" class="font-headline text-headline-sm text-light-on-surface">Danger Zone</h2>
      <p data-design-text-token="body-sm" class="text-body-sm text-light-on-surface-variant">Permanently delete all 4 selected bookmarks from this browser.</p>
      <button data-component-id="button-destructive" data-component-type="button" data-component-variant="destructive" type="button" class="w-full inline-flex items-center justify-center gap-1.5 min-h-11 px-4 py-2 rounded bg-danger text-light-on-primary shadow-sm hover:bg-light-error focus-visible:outline focus-visible:outline-2 focus-visible:outline-danger">
        <span class="material-symbols-outlined text-[18px]" aria-hidden="true">delete</span>
        <span data-design-text-token="label-lg" class="text-label-lg">Delete 4 Bookmarks</span>
      </button>
    </section>
  </main>

  <!-- Sticky Bottom Action Footer -->
  <footer class="fixed bottom-0 inset-x-0 z-20 bg-light-surface-container-low/95 backdrop-blur-sm border-t border-light-outline-variant px-4 py-3 flex items-center gap-3">
    <button data-component-id="button-secondary" data-component-type="button" data-component-variant="secondary" type="button" class="flex-1 inline-flex items-center justify-center min-h-11 px-4 py-2 rounded bg-light-surface-container text-light-on-surface border border-light-outline-variant hover:bg-light-surface-container-high focus-visible:outline focus-visible:outline-2 focus-visible:outline-light-primary">
      <span data-design-text-token="label-lg" class="text-label-lg">Cancel</span>
    </button>
    <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="button" class="flex-1 inline-flex items-center justify-center min-h-11 px-4 py-2 rounded bg-light-primary-container text-light-on-primary shadow-sm hover:bg-light-primary focus-visible:outline focus-visible:outline-2 focus-visible:outline-light-primary">
      <span data-design-text-token="label-lg" class="text-label-lg">Apply Changes</span>
    </button>
  </footer>



</body></html>
