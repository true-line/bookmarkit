  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&amp;family=Radio+Canada+Big:wght@400;500;600;700&amp;family=Red+Hat+Text:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>
    .material-symbols-outlined {
      display: inline-block;
      width: 1em;
      height: 1em;
      line-height: 1 !important;
      box-sizing: content-box;
      overflow: hidden;
      white-space: nowrap;
      direction: ltr;
      vertical-align: middle;
    }
  </style>
</head>
<body class="bg-light-surface text-light-on-surface font-body antialiased">
  <div class="min-h-[1024px] flex flex-col items-center justify-center bg-light-scrim/45 p-6 gap-6" data-stitch-vh="min-h-[1024px]===min-h-screen">
    <!-- Bulk Edit Modal -->
    <dialog open data-component-id="modal-standard" data-component-type="modal" data-component-variant="standard" aria-modal="true" aria-labelledby="bulk-title" class="static m-0 w-full max-w-lg rounded-lg bg-light-surface-container-lowest border border-light-outline-variant shadow-2xl text-light-on-surface">
      <header class="flex items-start justify-between gap-4 px-6 pt-6 pb-4 border-b border-light-outline-variant text-start">
        <div>
          <h1 id="bulk-title" data-design-text-token="headline-md" class="font-headline text-headline-md text-light-on-surface tabular-nums">Bulk Edit 12 Bookmarks</h1>
          <p data-design-text-token="body-sm" class="text-body-sm text-light-on-surface-variant mt-1">Only fields you change are applied. All 12 updates revert in one undo.</p>
        </div>
        <button data-component-id="button-icon" data-component-type="button" data-component-variant="icon" type="button" aria-label="Close dialog" class="inline-flex items-center justify-center min-w-9 min-h-9 rounded bg-light-surface-container text-light-on-surface-variant border border-light-outline-variant hover:bg-light-surface-container-high focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-light-primary transition-colors duration-state-change ease-state-change motion-reduce:transition-none">
          <span class="material-symbols-outlined text-[20px]" aria-hidden="true">close</span>
        </button>
      </header>

      <form class="p-6 flex flex-col gap-5 text-start">
        <label class="flex flex-col gap-1.5">
          <span data-design-text-token="label-md" class="text-label-md text-light-on-surface">Add tags (comma-separated)</span>
          <input type="text" dir="auto" placeholder="e.g., cli, reference" class="w-full min-h-10 rounded border border-light-outline bg-light-surface-container-lowest px-3.5 py-2 text-body-md text-light-on-surface placeholder:text-light-outline focus:border-light-primary focus:ring-1 focus:ring-light-primary">
        </label>

        <label class="flex flex-col gap-1.5">
          <span data-design-text-token="label-md" class="text-label-md text-light-on-surface">Move to folder</span>
          <input type="text" dir="auto" value="Engineering/Terminal &amp; CLI" class="w-full min-h-10 rounded border border-light-outline bg-light-surface-container-lowest px-3.5 py-2 text-body-md text-light-on-surface focus:border-light-primary focus:ring-1 focus:ring-light-primary">
        </label>

        <label class="flex flex-col gap-1.5">
          <span data-design-text-token="label-md" class="text-label-md text-light-on-surface">Set rating</span>
          <select class="w-full min-h-10 rounded border border-light-outline bg-light-surface-container-lowest px-3 py-2 text-body-md text-light-on-surface focus:border-light-primary focus:ring-1 focus:ring-light-primary">
            <option selected>Keep existing ratings</option>
            <option>5 stars</option>
            <option>4 stars</option>
            <option>3 stars</option>
            <option>Clear rating</option>
          </select>
        </label>
      </form>

      <footer class="flex flex-wrap items-center justify-between gap-3 px-6 py-4 bg-light-surface-container-low border-t border-light-outline-variant rounded-b-lg">
        <button data-component-id="button-destructive" data-component-type="button" data-component-variant="destructive" type="button" class="inline-flex items-center justify-center gap-1.5 min-h-10 px-4 py-2 rounded bg-danger text-light-on-primary shadow-sm hover:bg-light-error text-label-lg focus-visible:outline focus-visible:outline-2 focus-visible:outline-danger">
          <span class="material-symbols-outlined text-[16px]" aria-hidden="true">delete</span>
          <span>Delete 12</span>
        </button>

        <div class="flex flex-wrap items-center gap-2.5">
          <button data-component-id="button-secondary" data-component-type="button" data-component-variant="secondary" type="button" class="inline-flex items-center justify-center min-h-9 px-4 py-2 rounded bg-light-surface-container text-light-on-surface border border-light-outline-variant hover:bg-light-surface-container-high text-label-lg focus-visible:outline focus-visible:outline-2 focus-visible:outline-light-primary">Cancel</button>
          <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="button" class="inline-flex items-center justify-center min-h-10 px-4 py-2 rounded bg-light-primary-container text-light-on-primary shadow-sm hover:bg-light-primary text-label-lg focus-visible:outline focus-visible:outline-2 focus-visible:outline-light-primary">Apply Changes</button>
        </div>
      </footer>
    </dialog>

    <!-- Undo Toast Preview -->
    <div role="status" aria-live="polite" class="w-full max-w-lg rounded-md bg-light-inverse-surface text-light-inverse-on-surface px-4 py-3 shadow-lg flex items-center justify-between gap-4">
      <span data-design-text-token="body-md" class="text-body-md tabular-nums">Updated 12 bookmarks</span>
      <button type="button" class="text-label-md text-light-inverse-primary underline hover:no-underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-light-inverse-primary rounded">Undo (Cmd+Z)</button>
    </div>
  </div>


</body></html>
