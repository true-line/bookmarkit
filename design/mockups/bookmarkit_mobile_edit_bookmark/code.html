        'dark-surface-container-highest': '#2E353E',

        'dark-on-surface-variant': '#AEB4BE',

        'body-lg': ['15px', { lineHeight: '22px', letterSpacing: '0px', fontWeight: '400' }],
        'body-md': ['14px', { lineHeight: '20px', letterSpacing: '0px', fontWeight: '400' }],
        'body-sm': ['12px', { lineHeight: '18px', letterSpacing: '0px', fontWeight: '400' }],
        'label-lg': ['14px', { lineHeight: '20px', letterSpacing: '0px', fontWeight: '600' }],

        'surface-enter': '0ms',
        'surface-exit': '0ms',
      },
      transitionTimingFunction: {
        'state-change': 'ease-out',

  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&amp;family=Radio+Canada+Big:wght@400;500;600;700&amp;family=Red+Hat+Text:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>
    .material-symbols-outlined {
      display: inline-block;
      width: 1em;
      height: 1em;
      line-height: 1 !important;
      box-sizing: content-box;
      overflow: hidden;
      white-space: nowrap;
      direction: ltr;
      vertical-align: middle;
    }
  </style>
</head>
<body class="bg-light-surface text-light-on-surface font-body antialiased min-h-[884px] flex flex-col" data-stitch-vh="min-h-[884px]===min-h-screen">

  <!-- Sticky Mobile App Bar -->
  <header class="sticky top-0 z-20 bg-light-surface-container-low/95 backdrop-blur-sm border-b border-light-outline-variant px-4 py-3 flex items-center justify-between gap-3">
    <div class="flex items-center gap-2.5 min-w-0">
      <button data-component-id="button-icon" data-component-type="button" data-component-variant="icon" type="button" aria-label="Back to bookmarks" class="inline-flex items-center justify-center min-w-11 min-h-11 rounded bg-light-surface-container text-light-on-surface border border-light-outline-variant hover:bg-light-surface-container-high focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-light-primary transition-colors duration-state-change ease-state-change motion-reduce:transition-none shrink-0">
        <span class="material-symbols-outlined text-[20px]" aria-hidden="true">arrow_back</span>
      </button>
      <div class="min-w-0 text-start">
        <h1 data-design-text-token="headline-sm" class="font-headline text-headline-sm text-light-on-surface truncate">Edit Bookmark</h1>
        <p data-design-text-token="label-sm" class="text-label-sm text-light-on-surface-variant truncate">Terminal &amp; CLI</p>
      </div>
    </div>

    <button data-component-id="button-icon" data-component-type="button" data-component-variant="icon" type="button" aria-label="Delete bookmark" class="inline-flex items-center justify-center min-w-11 min-h-11 rounded bg-light-surface-container text-danger border border-light-outline-variant hover:bg-light-error-container focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-danger transition-colors duration-state-change ease-state-change motion-reduce:transition-none shrink-0">
      <span class="material-symbols-outlined text-[20px]" aria-hidden="true">delete</span>
    </button>
  </header>

  <!-- Main Form -->
  <main class="flex-1 px-4 py-4 pb-28">
    <form class="flex flex-col gap-5 text-start">
      <!-- Title -->
      <label class="flex flex-col gap-1.5">
        <span data-design-text-token="label-md" class="text-label-md text-light-on-surface">Title</span>
        <input type="text" dir="auto" value="macOS Login Shells — Ghostty Help" class="w-full min-h-11 rounded border border-light-outline bg-light-surface-container-lowest px-3.5 py-2.5 text-body-md text-light-on-surface focus:border-light-primary focus:outline-none focus:ring-2 focus:ring-light-primary/20 transition-colors duration-state-change ease-state-change motion-reduce:transition-none">
      </label>

      <!-- URL with Live Validation -->
      <label class="flex flex-col gap-1.5">
        <span data-design-text-token="label-md" class="text-label-md text-light-on-surface">URL</span>
        <div class="relative flex items-center">
          <input type="url" dir="ltr" value="https://ghostty.org/docs/help/macos-login-shells" aria-describedby="mobile-url-status" class="w-full min-h-11 rounded border border-success bg-light-surface-container-lowest ps-3.5 pe-10 py-2.5 font-mono text-mono-sm text-light-on-surface focus:border-success focus:outline-none focus:ring-2 focus:ring-success/20 transition-colors duration-state-change ease-state-change motion-reduce:transition-none">
          <span class="material-symbols-outlined text-success text-[18px] absolute end-3 pointer-events-none" aria-hidden="true">check_circle</span>
        </div>
        <span id="mobile-url-status" role="status" data-design-text-token="body-sm" class="text-body-sm text-success">Valid public http(s) URL</span>
      </label>

      <!-- Description + Unified AI Suggest -->
      <div class="flex flex-col gap-1.5">
        <div class="flex items-center justify-between gap-2">
          <label for="mobile-bm-desc" data-design-text-token="label-md" class="text-label-md text-light-on-surface">Description</label>
          <button data-component-id="button-tertiary" data-component-type="button" data-component-variant="tertiary" type="button" class="inline-flex items-center justify-center gap-1.5 min-h-9 px-3 py-1.5 rounded bg-light-tertiary-container text-light-on-tertiary shadow-sm hover:bg-light-tertiary focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-light-tertiary transition-colors duration-state-change ease-state-change motion-reduce:transition-none">
            <span class="material-symbols-outlined text-[15px]" aria-hidden="true">auto_awesome</span>
            <span data-design-text-token="label-md" class="text-label-md">Suggest</span>
          </button>
        </div>
        <textarea id="mobile-bm-desc" dir="auto" rows="3" placeholder="Add notes or generate a concise summary..." class="w-full rounded border border-light-outline bg-light-surface-container-lowest px-3.5 py-2.5 text-body-md text-light-on-surface placeholder:text-light-outline focus:border-light-primary focus:outline-none focus:ring-2 focus:ring-light-primary/20 transition-colors duration-state-change ease-state-change motion-reduce:transition-none">Official Ghostty documentation explaining how macOS login shells initialize PATH and environment variables.</textarea>
      </div>

      <!-- Tags + Unified AI Suggest -->
      <div class="flex flex-col gap-1.5">
        <div class="flex items-center justify-between gap-2">
          <label for="mobile-bm-tags" data-design-text-token="label-md" class="text-label-md text-light-on-surface">Tags</label>
          <button data-component-id="button-tertiary" data-component-type="button" data-component-variant="tertiary" type="button" class="inline-flex items-center justify-center gap-1.5 min-h-9 px-3 py-1.5 rounded bg-light-tertiary-container text-light-on-tertiary shadow-sm hover:bg-light-tertiary focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-light-tertiary transition-colors duration-state-change ease-state-change motion-reduce:transition-none">
            <span class="material-symbols-outlined text-[15px]" aria-hidden="true">auto_awesome</span>
            <span data-design-text-token="label-md" class="text-label-md">Suggest</span>
          </button>
        </div>
        <input id="mobile-bm-tags" type="text" dir="auto" value="macos, shell, terminal" placeholder="e.g., development, web, reference" class="w-full min-h-11 rounded border border-light-outline bg-light-surface-container-lowest px-3.5 py-2.5 text-body-md text-light-on-surface placeholder:text-light-outline focus:border-light-primary focus:outline-none focus:ring-2 focus:ring-light-primary/20">
        <div class="flex flex-wrap gap-1.5 pt-1">
          <span class="px-2.5 py-1 rounded bg-light-surface-container-low border border-light-outline-variant text-label-sm text-light-on-surface-variant">#macos</span>
          <span class="px-2.5 py-1 rounded bg-light-surface-container-low border border-light-outline-variant text-label-sm text-light-on-surface-variant">#shell</span>
          <span class="px-2.5 py-1 rounded bg-light-surface-container-low border border-light-outline-variant text-label-sm text-light-on-surface-variant">#terminal</span>
        </div>
      </div>

      <!-- Folder -->
      <label class="flex flex-col gap-1.5">
        <span data-design-text-token="label-md" class="text-label-md text-light-on-surface">Folder</span>
        <select class="w-full min-h-11 rounded border border-light-outline bg-light-surface-container-lowest px-3.5 py-2.5 text-body-md text-light-on-surface focus:border-light-primary focus:outline-none focus:ring-2 focus:ring-light-primary/20">
          <option value="terminal" selected>Terminal &amp; CLI</option>
          <option value="ai">AI &amp; Agents</option>
          <option value="design">Design Systems</option>
          <option value="none">No folder</option>
        </select>
      </label>

      <!-- Rating (44px tap targets) -->
      <fieldset class="flex flex-col gap-2">
        <legend data-design-text-token="label-md" class="text-label-md text-light-on-surface">Rating</legend>
        <div class="flex items-center gap-1.5" role="radiogroup" aria-label="Bookmark rating">
          <button type="button" aria-label="1 star" class="min-w-11 min-h-11 inline-flex items-center justify-center rounded bg-light-surface-container-lowest border border-light-outline-variant text-light-primary">
            <span class="material-symbols-outlined text-[22px]" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">star</span>
          </button>
          <button type="button" aria-label="2 stars" class="min-w-11 min-h-11 inline-flex items-center justify-center rounded bg-light-surface-container-lowest border border-light-outline-variant text-light-primary">
            <span class="material-symbols-outlined text-[22px]" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">star</span>
          </button>
          <button type="button" aria-label="3 stars" class="min-w-11 min-h-11 inline-flex items-center justify-center rounded bg-light-surface-container-lowest border border-light-outline-variant text-light-primary">
            <span class="material-symbols-outlined text-[22px]" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">star</span>
          </button>
          <button type="button" aria-label="4 stars" aria-pressed="true" class="min-w-11 min-h-11 inline-flex items-center justify-center rounded bg-light-surface-container-lowest border border-light-outline-variant text-light-primary">
            <span class="material-symbols-outlined text-[22px]" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">star</span>
          </button>
          <button type="button" aria-label="5 stars" class="min-w-11 min-h-11 inline-flex items-center justify-center rounded bg-light-surface-container-lowest border border-light-outline-variant text-light-outline">
            <span class="material-symbols-outlined text-[22px]" aria-hidden="true">star</span>
          </button>
          <span class="ms-2 text-label-md text-light-on-surface-variant tabular-nums">4 / 5</span>
        </div>
      </fieldset>
    </form>
  </main>

  <!-- Sticky Bottom Action Footer -->
  <footer class="fixed bottom-0 inset-x-0 z-20 bg-light-surface-container-low/95 backdrop-blur-sm border-t border-light-outline-variant px-4 py-3 flex items-center gap-3">
    <button data-component-id="button-secondary" data-component-type="button" data-component-variant="secondary" type="button" class="flex-1 inline-flex items-center justify-center min-h-11 px-4 py-2 rounded bg-light-surface-container text-light-on-surface border border-light-outline-variant hover:bg-light-surface-container-high focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-light-primary transition-colors duration-state-change ease-state-change motion-reduce:transition-none">
      <span data-design-text-token="label-lg" class="text-label-lg">Cancel</span>
    </button>
    <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="button" class="flex-1 inline-flex items-center justify-center min-h-11 px-4 py-2 rounded bg-light-primary-container text-light-on-primary shadow-sm hover:bg-light-primary focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-light-primary transition-colors duration-state-change ease-state-change motion-reduce:transition-none">
      <span data-design-text-token="label-lg" class="text-label-lg">Save Changes</span>
    </button>
  </footer>



</body></html>
