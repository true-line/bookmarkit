  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&amp;family=Radio+Canada+Big:wght@400;500;600;700&amp;family=Red+Hat+Text:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>
    .material-symbols-outlined {
      display: inline-block;
      width: 1em;
      height: 1em;
      line-height: 1 !important;
      box-sizing: content-box;
      overflow: hidden;
      white-space: nowrap;
      direction: ltr;
      vertical-align: middle;
    }
  </style>

<body class="bg-light-surface text-light-on-surface font-body antialiased min-h-[884px] flex flex-col" data-stitch-vh="min-h-[884px]===min-h-screen">

  <!-- Sticky Mobile Top Bar -->
  <header class="sticky top-0 z-20 bg-light-surface-container-low/95 backdrop-blur-sm border-b border-light-outline-variant px-4 py-3 flex items-center justify-between gap-2">
    <div class="flex items-center gap-2.5 min-w-0">
      <button data-component-id="button-icon" data-component-type="button" data-component-variant="icon" type="button" aria-label="Open navigation menu" class="inline-flex items-center justify-center min-w-11 min-h-11 rounded bg-light-surface-container text-light-on-surface border border-light-outline-variant hover:bg-light-surface-container-high focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-light-primary transition-colors duration-state-change ease-state-change motion-reduce:transition-none shrink-0">
        <span class="material-symbols-outlined text-[22px]" aria-hidden="true">menu</span>
      </button>
      <div class="flex items-center gap-2 min-w-0">
        <div class="w-8 h-8 rounded bg-light-primary-container text-light-on-primary flex items-center justify-center shrink-0 shadow-sm">
          <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">bookmark</span>
        </div>
        <div class="min-w-0 text-start">
          <h1 data-design-text-token="headline-sm" class="font-headline text-headline-sm text-light-on-surface truncate">BookmarkIt</h1>
          <p data-design-text-token="label-sm" class="text-label-sm text-light-on-surface-variant tabular-nums truncate">0 saved</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Centered Empty State -->
  <main class="flex-1 px-6 py-10 flex flex-col items-center justify-center text-center">
    <div class="w-16 h-16 rounded-full bg-light-surface-container-high text-light-primary flex items-center justify-center mb-5 shadow-sm">
      <span class="material-symbols-outlined text-[32px]" aria-hidden="true">bookmarks</span>
    </div>

    <h2 data-design-text-token="headline-md" class="font-headline text-headline-md text-light-on-surface mb-2">Your shelf is empty</h2>
    <p data-design-text-token="body-md" class="text-body-md text-light-on-surface-variant max-w-xs mb-6">
      Save your first link or import bookmarks from Chrome, Firefox, or a JSON backup. Everything stays local to this browser.
    </p>

    <div class="w-full max-w-xs flex flex-col gap-3">
      <button data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="button" class="w-full inline-flex items-center justify-center gap-2 min-h-11 px-4 py-2.5 rounded bg-light-primary-container text-light-on-primary shadow-sm hover:bg-light-primary focus-visible:outline focus-visible:outline-2 focus-visible:outline-light-primary">
        <span class="material-symbols-outlined text-[18px]" aria-hidden="true">add</span>
        <span data-design-text-token="label-lg" class="text-label-lg">Add First Bookmark</span>
      </button>

      <button data-component-id="button-secondary" data-component-type="button" data-component-variant="secondary" type="button" class="w-full inline-flex items-center justify-center gap-2 min-h-11 px-4 py-2.5 rounded bg-light-surface-container text-light-on-surface border border-light-outline-variant hover:bg-light-surface-container-high focus-visible:outline focus-visible:outline-2 focus-visible:outline-light-primary">
        <span class="material-symbols-outlined text-[18px] text-light-on-surface-variant" aria-hidden="true">upload_file</span>
        <span data-design-text-token="label-lg" class="text-label-lg">Import Bookmarks</span>
      </button>
    </div>
  </main>



</body></html>
